<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" fill="none">
  <defs>
    <linearGradient id="ag-sky" x1="0" y1="0" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EC9578"/>
      <stop offset="55%" stop-color="#F6C295"/>
      <stop offset="100%" stop-color="#FFF2E5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#ag-sky)"/>
  <circle cx="855" cy="185" r="145" fill="#F6AE84" opacity="0.35"/>
  <circle cx="855" cy="185" r="105" fill="#FFF8EA"/>
  <path d="M0 390 Q310 345 620 385 Q920 350 1200 380 L1200 500 L0 500 Z" fill="#CF7E6C" opacity="0.7"/>
  <!-- Taj Mahal Plinth, Minarets, and Onion Domes -->
  <g transform="translate(555, 105)">
    <!-- Four Minarets -->
    <rect x="18" y="85" width="18" height="215" fill="#FFF8F3" stroke="#C96D5D" stroke-width="1.5"/>
    <path d="M14 85 Q27 65 40 85 Z" fill="#FDE8DC"/>
    <rect x="72" y="115" width="14" height="185" fill="#FDE8DC" stroke="#C96D5D" stroke-width="1.2"/>
    <rect x="494" y="115" width="14" height="185" fill="#FDE8DC" stroke="#C96D5D" stroke-width="1.2"/>
    <rect x="544" y="85" width="18" height="215" fill="#FFF8F3" stroke="#C96D5D" stroke-width="1.5"/>
    <path d="M540 85 Q553 65 566 85 Z" fill="#FDE8DC"/>
    <!-- Main Mausoleum -->
    <rect x="135" y="140" width="310" height="160" rx="4" fill="#FFF8F3" stroke="#C96D5D" stroke-width="2"/>
    <!-- Central Onion Dome -->
    <path d="M225 140 C210 75 260 35 290 12 C320 35 370 75 355 140 Z" fill="#FFF8F3" stroke="#C96D5D" stroke-width="2"/>
    <line x1="290" y1="-8" x2="290" y2="14" stroke="#9E4640" stroke-width="3"/>
    <!-- Side Chhatri Domes -->
    <path d="M165 140 C160 105 182 88 195 75 C208 88 230 105 225 140 Z" fill="#FDE8DC" stroke="#C96D5D" stroke-width="1.5"/>
    <path d="M355 140 C350 105 372 88 385 75 C398 88 420 105 415 140 Z" fill="#FDE8DC" stroke="#C96D5D" stroke-width="1.5"/>
    <!-- Pishtaq Grand Iwan Arch -->
    <path d="M242 300 L242 195 A48 48 0 0 1 338 195 L338 300 Z" fill="#9E4640"/>
    <path d="M254 300 L254 205 A36 36 0 0 1 326 205 L326 300 Z" fill="#471E20"/>
    <!-- Side Arched Niches -->
    <path d="M165 215 L165 178 A20 20 0 0 1 205 178 L205 215 Z" fill="#9E4640"/>
    <path d="M165 285 L165 242 A20 20 0 0 1 205 242 L205 285 Z" fill="#9E4640"/>
    <path d="M375 215 L375 178 A20 20 0 0 1 415 178 L415 215 Z" fill="#9E4640"/>
    <path d="M375 285 L375 242 A20 20 0 0 1 415 242 L415 285 Z" fill="#9E4640"/>
    <!-- Marble Plinth -->
    <rect x="0" y="300" width="580" height="24" fill="#FDE8DC" stroke="#9E4640" stroke-width="1.5"/>
  </g>
  <!-- Yamuna River & Reflecting Pool -->
  <rect x="0" y="425" width="1200" height="75" fill="#266582"/>
  <path d="M680 448 L1010 448 M720 468 L970 468" stroke="#F7C9B0" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
